<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Convierte documentos en audiolibros con voces para narrador y personajes.">
    <title>{% block title %}Smart Audiobook{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Volver al inicio">
        <span class="brand-mark" aria-hidden="true">SA</span>
        <span>Smart Audiobook</span>
      </a>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Smart Audiobook V0.5 · Procesamiento local y modular</p>
    </footer>
  </body>
</html>
