[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-audiobook"
version = "0.3.0"
description = "Identifica hablantes y genera audiolibros con una voz por personaje."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyttsx3>=2.90,<3.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
smart-audiobook = "smart_audiobook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
