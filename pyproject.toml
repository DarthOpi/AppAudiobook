[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-audiobook"
version = "0.8.0"
description = "Convierte documentos en audiolibros desde CLI o interfaz web."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.0,<7.0",
    "python-docx>=1.2,<2.0",
    "pyttsx3>=2.90,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0,<2.0",
]
local-tts = [
    "piper-tts>=1.4,<2.0",
]
web = [
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.34,<1.0",
]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[project.scripts]
smart-audiobook = "smart_audiobook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_audiobook = ["templates/*.html", "static/*.css"]
