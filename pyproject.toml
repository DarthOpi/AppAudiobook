[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-audiobook"
version = "0.4.0"
description = "Convierte documentos estructurados en audiolibros por capítulos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.0,<7.0",
    "python-docx>=1.2,<2.0",
    "pyttsx3>=2.90,<3.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
smart-audiobook = "smart_audiobook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
